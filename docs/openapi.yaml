openapi: 3.0.3

info:
  title: Araya Business Hub - API Modul M1
  description: |
    Modul M1: Autentikasi, Organisasi (multi-tenant), Pengguna, Peran & Izin, Divisi, dan Audit Log.

    - Platform dipakai banyak organisasi. Super admin platform mendaftarkan organisasi;
      tiap organisasi mengelola pengguna, peran (beserta izinnya), dan divisinya sendiri.
    - Hak akses diperiksa per **izin** (`permissions` di token), bukan per nama peran.
    - Semua respons memakai amplop `success` / `data` / `error`; daftar menambah `meta`.
    - Tanggal dan jam dikirim dalam ISO 8601 zona WIB (`+07:00`).
    - Token JWT (HS256) berlaku 8 jam dan memuat `user_id`, `name`, `organization_id`, `role`,
      `permissions`, `division`, `unit_usaha_id`, dan `exp`.
    - Endpoint publik ditandai `security: []`.
  version: 3.0.0

servers:
  - url: http://localhost:8080
    description: Local Development

tags:
  - name: Health
  - name: Auth
    description: Login, profil (K-01), dan ubah kata sandi
  - name: Organizations
    description: 'Khusus super admin (izin `platform.organizations.manage`)'
  - name: Users
    description: 'Pengguna organisasi (izin `m1.users.read` / `m1.users.manage`)'
  - name: Roles
    description: 'Peran dan katalog izin (izin `m1.roles.manage`)'
  - name: Divisions
    description: 'Divisi organisasi (izin `m1.divisions.manage`)'
  - name: Audit
    description: 'Audit log organisasi (izin `m1.audit.read`)'

security:
  - bearerAuth: []

paths:

  /health:
    get:
      tags: [Health]
      summary: Cek server hidup
      security: []
      responses:
        '200':
          description: Server aktif
          content:
            application/json:
              example: { status: ok }

  /ready:
    get:
      tags: [Health]
      summary: Cek koneksi database
      security: []
      responses:
        '200':
          description: Database terhubung
          content:
            application/json:
              example: { status: ready, database: connected }
        '503':
          description: Database tidak dapat diakses

  /api/m1/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login dan terbitkan JWT (publik)
      description: |
        `INVALID_CREDENTIALS` tidak membedakan email tidak ada dan kata sandi salah.
        `ACCOUNT_INACTIVE` / `ORGANIZATION_INACTIVE` hanya dikembalikan bila kata sandi benar.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/LoginResult' }
        '400': { $ref: '#/components/responses/InvalidParameter' }
        '401':
          description: Kredensial salah, akun nonaktif, atau organisasi nonaktif
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalid:
                  value: { success: false, error: { code: INVALID_CREDENTIALS, message: Kredensial invalid, fields: null } }
                inactive:
                  value: { success: false, error: { code: ACCOUNT_INACTIVE, message: Akun dinonaktifkan, fields: null } }
                orgInactive:
                  value: { success: false, error: { code: ORGANIZATION_INACTIVE, message: Organisasi dinonaktifkan, fields: null } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/m1/v1/me:
    get:
      tags: [Auth]
      summary: Profil pengguna dari token (kontrak K-01)
      description: Data terbaru dari database. Akun/organisasi yang dinonaktifkan setelah token terbit ditolak.
      operationId: getMe
      responses:
        '200':
          description: Profil pengguna
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/m1/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Ubah kata sandi sendiri
      description: 'Aturan: minimal 8 karakter, huruf dan angka, maksimal 72 byte, tidak sama dengan kata sandi lama.'
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Kata sandi berhasil diganti
          content:
            application/json:
              example: { success: true, data: { changed_at: '2026-11-04T10:00:00+07:00' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: Kata sandi lama salah atau kata sandi baru tidak memenuhi aturan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                oldInvalid:
                  value: { success: false, error: { code: OLD_PASSWORD_INVALID, message: Kata sandi lama salah, fields: { old_password: Kata sandi lama salah } } }
                newInvalid:
                  value: { success: false, error: { code: VALIDATION_ERROR, message: Isian tidak valid, fields: { new_password: Kata sandi baru tidak memenuhi aturan } } }

  /api/m1/v1/organizations:
    get:
      tags: [Organizations]
      summary: Daftar organisasi
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: q, in: query, description: Cari nama atau kode, schema: { type: string } }
        - { name: is_active, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Daftar organisasi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Organization' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Organizations]
      summary: Daftarkan organisasi + administrator pertamanya
      description: Membuat organisasi, peran bawaan `administrator` (semua izin organisasi), dan akun administrator pertama dalam satu transaksi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganizationRequest' }
      responses:
        '201':
          description: Organisasi dibuat
          content:
            application/json:
              example: { success: true, data: { id: 7, code: bpu-unpas, name: BPU Universitas Pasundan, is_active: true, created_at: '2026-11-04T09:00:00+07:00', admin: { id: 12, email: admin@bpu.ac.id } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Kode organisasi atau email administrator sudah dipakai
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                code:
                  value: { success: false, error: { code: ORGANIZATION_CODE_DUPLICATE, message: Kode organisasi sudah dipakai, fields: { code: Kode organisasi sudah dipakai } } }
                email:
                  value: { success: false, error: { code: EMAIL_DUPLICATE, message: Email sudah terdaftar, fields: { email: Email sudah terdaftar } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/m1/v1/organizations/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags: [Organizations]
      summary: Detail organisasi
      responses:
        '200': { description: Detail organisasi }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Organizations]
      summary: Ubah nama organisasi
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameRequest' }
      responses:
        '200': { description: Organisasi setelah diubah }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Organizations]
      summary: Nonaktifkan organisasi
      description: Semua pengguna organisasi tidak bisa login lagi (`ORGANIZATION_INACTIVE`). Data tidak dihapus.
      responses:
        '200': { $ref: '#/components/responses/Deactivated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`ORGANIZATION_ALREADY_INACTIVE`' }

  /api/m1/v1/organizations/{id}/status:
    parameters:
      - $ref: '#/components/parameters/ID'
    patch:
      tags: [Organizations]
      summary: Aktifkan atau nonaktifkan organisasi
      description: >-
        Izin `platform.organizations.manage`. Data di dalam organisasi tidak berubah, jadi setelah
        aktif kembali penggunanya yang aktif bisa login lagi.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusRequest' }
      responses:
        '200': { $ref: '#/components/responses/Deactivated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`ORGANIZATION_ALREADY_ACTIVE` atau `ORGANIZATION_ALREADY_INACTIVE`' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/m1/v1/organizations/{id}/permanent:
    parameters:
      - $ref: '#/components/parameters/ID'
    delete:
      tags: [Organizations]
      summary: Hapus permanen organisasi
      description: >-
        Hanya untuk organisasi yang sudah dinonaktifkan. Seluruh pengguna, peran, dan divisinya ikut
        dihapus dalam satu transaksi. Audit log organisasi tidak dihapus: `organization_id` menjadi
        null, `organization_name` tetap tersimpan, dan log tetap tampil di `GET /platform/audit-logs`.
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`ORGANIZATION_STILL_ACTIVE`' }

  /api/m1/v1/users:
    get:
      tags: [Users]
      summary: Daftar pengguna organisasi
      description: 'Izin: `m1.users.read` atau `m1.users.manage`.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: q, in: query, description: Cari di nama atau email, schema: { type: string } }
        - { name: role, in: query, description: Kode peran, schema: { type: string } }
        - { name: division, in: query, description: Kode divisi, schema: { type: string } }
        - { name: unit_usaha_id, in: query, schema: { type: integer, format: int64 } }
        - { name: is_active, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, -created_at, name, -name, email, -email], default: -created_at } }
      responses:
        '200':
          description: 'Daftar pengguna (kosong tetap 200 dengan `data: []`)'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/User' } }
        '400': { $ref: '#/components/responses/InvalidParameter' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      summary: Tambah pengguna
      description: '`role` dan `division` adalah kode milik organisasi pemanggil. Izin: `m1.users.manage`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Pengguna dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: '`EMAIL_DUPLICATE` (email unik di seluruh platform)' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/m1/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags: [Users]
      summary: Detail pengguna
      responses:
        '200': { description: Detail pengguna }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      summary: Ubah nama, peran, divisi, atau unit usaha
      description: Hanya field yang dikirim yang berubah. Nilai baru masuk ke token pada login berikutnya.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200': { description: Pengguna setelah diubah }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Users]
      summary: Nonaktifkan pengguna (soft delete)
      responses:
        '200': { $ref: '#/components/responses/Deactivated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`USER_ALREADY_INACTIVE` atau `CANNOT_DEACTIVATE_SELF`' }

  /api/m1/v1/users/{id}/status:
    parameters:
      - $ref: '#/components/parameters/ID'
    patch:
      tags: [Users]
      summary: Aktifkan atau nonaktifkan pengguna
      description: >-
        Izin `m1.users.manage`. Riwayat akun tetap utuh. Akun hanya bisa diaktifkan bila peran dan
        divisinya masih aktif; bila tidak, ganti dulu lewat `PATCH /users/{id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusRequest' }
      responses:
        '200': { $ref: '#/components/responses/Deactivated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`USER_ALREADY_ACTIVE`, `USER_REFERENCE_INACTIVE`, `USER_ALREADY_INACTIVE`, atau `CANNOT_DEACTIVATE_SELF`' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/m1/v1/users/{id}/permanent:
    parameters:
      - $ref: '#/components/parameters/ID'
    delete:
      tags: [Users]
      summary: Hapus permanen pengguna
      description: >-
        Izin `m1.users.manage`. Hanya untuk akun yang sudah dinonaktifkan. Audit log tidak dihapus:
        data terakhir akun dicatat di `user.deleted`, dan log yang pelakunya akun ini tetap
        menampilkan `actor_name`/`actor_email` (dengan `user_id` null).
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`USER_STILL_ACTIVE`' }

  /api/m1/v1/roles:
    get:
      tags: [Roles]
      summary: Daftar peran organisasi
      description: 'Izin: `m1.roles.manage`, `m1.users.manage`, atau `m1.users.read` (untuk dropdown).'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: is_active, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Daftar peran beserta izinnya
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Role' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Roles]
      summary: Tambah peran
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
      responses:
        '201': { description: Peran dibuat }
        '409': { description: '`ROLE_CODE_DUPLICATE`' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/m1/v1/roles/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags: [Roles]
      summary: Detail peran
      responses:
        '200': { description: Detail peran }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Roles]
      summary: Ubah nama, deskripsi, dan/atau izin peran
      description: '`permissions` menggantikan seluruh izin peran. Peran bawaan tidak dapat diubah (`ROLE_SYSTEM_LOCKED`).'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleRequest' }
      responses:
        '200': { description: Peran setelah diubah }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`ROLE_SYSTEM_LOCKED`' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Roles]
      summary: Nonaktifkan peran
      responses:
        '200': { $ref: '#/components/responses/Deactivated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`ROLE_IN_USE`, `ROLE_ALREADY_INACTIVE`, atau `ROLE_SYSTEM_LOCKED`' }

  /api/m1/v1/roles/{id}/status:
    parameters:
      - $ref: '#/components/parameters/ID'
    patch:
      tags: [Roles]
      summary: Aktifkan atau nonaktifkan peran
      description: Izin `m1.roles.manage`. Peran aktif kembali dengan izin terakhirnya.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusRequest' }
      responses:
        '200': { $ref: '#/components/responses/Deactivated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`ROLE_ALREADY_ACTIVE`, `ROLE_ALREADY_INACTIVE`, `ROLE_IN_USE`, atau `ROLE_SYSTEM_LOCKED`' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/m1/v1/permissions:
    get:
      tags: [Roles]
      summary: Katalog izin yang dapat dipilih organisasi
      description: Daftar lengkap tanpa pagination (izin platform tidak ditampilkan).
      responses:
        '200':
          description: Katalog izin
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/m1/v1/divisions:
    get:
      tags: [Divisions]
      summary: Daftar divisi organisasi
      description: 'Izin: `m1.divisions.manage`, `m1.users.manage`, atau `m1.users.read`.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: is_active, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Daftar divisi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Division' } }
    post:
      tags: [Divisions]
      summary: Tambah divisi
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDivisionRequest' }
      responses:
        '201': { description: Divisi dibuat }
        '409': { description: '`DIVISION_CODE_DUPLICATE`' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/m1/v1/divisions/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags: [Divisions]
      summary: Detail divisi
      responses:
        '200': { description: Detail divisi }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Divisions]
      summary: Ubah nama divisi
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameRequest' }
      responses:
        '200': { description: Divisi setelah diubah }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Divisions]
      summary: Nonaktifkan divisi
      responses:
        '200': { $ref: '#/components/responses/Deactivated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`DIVISION_IN_USE` atau `DIVISION_ALREADY_INACTIVE`' }

  /api/m1/v1/divisions/{id}/status:
    parameters:
      - $ref: '#/components/parameters/ID'
    patch:
      tags: [Divisions]
      summary: Aktifkan atau nonaktifkan divisi
      description: Izin `m1.divisions.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusRequest' }
      responses:
        '200': { $ref: '#/components/responses/Deactivated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`DIVISION_ALREADY_ACTIVE`, `DIVISION_ALREADY_INACTIVE`, atau `DIVISION_IN_USE`' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/m1/v1/audit-logs:
    get:
      tags: [Audit]
      summary: Riwayat audit log organisasi
      description: Hanya catatan milik organisasi pemanggil. Tidak ada endpoint untuk mengubah atau menghapus audit log.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: from, in: query, description: 'Tanggal awal (YYYY-MM-DD, WIB), ikut dihitung', schema: { type: string, format: date } }
        - { name: to, in: query, description: 'Tanggal akhir (YYYY-MM-DD, WIB), ikut dihitung', schema: { type: string, format: date } }
        - { name: user_id, in: query, description: Pelaku, schema: { type: integer, format: int64 } }
        - { name: action, in: query, schema: { type: string, example: user.deactivated } }
        - { name: resource, in: query, schema: { type: string, enum: [users, auth, roles, divisions, organizations] } }
        - { name: sort, in: query, schema: { type: string, enum: [-created_at, created_at], default: -created_at } }
      responses:
        '200':
          description: 'Riwayat audit log (kosong tetap 200 dengan `data: []`)'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }
        '400': { $ref: '#/components/responses/InvalidParameter' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/m1/v1/platform/audit-logs:
    get:
      tags: [Audit]
      summary: Riwayat audit log semua organisasi (super admin)
      description: >-
        Izin `platform.organizations.manage`. Menampilkan log semua organisasi, termasuk organisasi yang
        sudah dihapus permanen (`organization_id` null, `organization_name` tetap terisi). Parameter sama
        dengan `GET /audit-logs`, ditambah filter `organization_id`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: organization_id, in: query, schema: { type: integer, format: int64 } }
        - { name: from, in: query, description: 'Tanggal awal (YYYY-MM-DD, WIB), ikut dihitung', schema: { type: string, format: date } }
        - { name: to, in: query, description: 'Tanggal akhir (YYYY-MM-DD, WIB), ikut dihitung', schema: { type: string, format: date } }
        - { name: user_id, in: query, description: Pelaku, schema: { type: integer, format: int64 } }
        - { name: action, in: query, schema: { type: string, example: organization.deleted } }
        - { name: resource, in: query, schema: { type: string, enum: [users, auth, roles, divisions, organizations] } }
        - { name: sort, in: query, schema: { type: string, enum: [-created_at, created_at], default: -created_at } }
      responses:
        '200':
          description: 'Riwayat audit log (kosong tetap 200 dengan `data: []`)'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }
        '400': { $ref: '#/components/responses/InvalidParameter' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceKey:
      type: apiKey
      in: header
      name: X-Service-Key

  parameters:
    Page:
      { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PerPage:
      { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    ID:
      { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }

  schemas:

    SuccessEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: {}

    ListEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: array, items: {} }
        meta: { $ref: '#/components/schemas/Meta' }

    Meta:
      type: object
      properties:
        page: { type: integer, example: 1 }
        per_page: { type: integer, example: 20 }
        total: { type: integer, example: 57 }
        total_pages: { type: integer, example: 3 }

    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string, example: Isian tidak valid }
            fields: { type: object, nullable: true, additionalProperties: { type: string } }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: rani@example.com }
        password: { type: string, maxLength: 72, example: rahasia123 }

    TokenUser:
      type: object
      description: Isi klaim token (kontrak bersama), tanpa `exp`.
      properties:
        user_id: { type: integer, format: int64, example: 42 }
        name: { type: string, example: Rani Kusumawati }
        organization_id: { type: integer, format: int64, nullable: true, description: null untuk super admin, example: 7 }
        role: { type: string, description: 'Kode peran di organisasi, atau `superadmin`', example: kasir-toko }
        permissions: { type: array, items: { type: string }, example: [m4.invoice.create, m4.order.update] }
        division: { type: string, nullable: true, example: penjualan }
        unit_usaha_id: { type: integer, format: int64, nullable: true, example: 3 }

    LoginResult:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 28800 }
        user: { $ref: '#/components/schemas/TokenUser' }

    Me:
      allOf:
        - $ref: '#/components/schemas/TokenUser'
        - type: object
          properties:
            email: { type: string, example: rani@example.com }
            organization_name: { type: string, nullable: true, example: BPU Universitas Pasundan }
            is_active: { type: boolean, example: true }

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 72 }

    StatusRequest:
      type: object
      required: [is_active]
      properties:
        is_active: { type: boolean, example: true }

    NameRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }

    Organization:
      type: object
      properties:
        id: { type: integer, format: int64, example: 7 }
        code: { type: string, example: bpu-unpas }
        name: { type: string, example: BPU Universitas Pasundan }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

    CreateOrganizationRequest:
      type: object
      required: [code, name, admin]
      properties:
        code: { type: string, pattern: '^[a-z0-9]+([_-][a-z0-9]+)*$', maxLength: 50, example: bpu-unpas }
        name: { type: string, maxLength: 150, example: BPU Universitas Pasundan }
        admin:
          type: object
          required: [name, email, password]
          properties:
            name: { type: string, example: Admin BPU }
            email: { type: string, format: email, example: admin@bpu.ac.id }
            password: { type: string, minLength: 8, maxLength: 72 }

    User:
      type: object
      properties:
        id: { type: integer, format: int64, example: 42 }
        name: { type: string, example: Budi Santoso }
        email: { type: string, example: budi@example.com }
        role: { type: string, example: kasir-toko }
        division: { type: string, nullable: true, example: penjualan }
        unit_usaha_id: { type: integer, format: int64, nullable: true, example: null }
        is_active: { type: boolean, example: true }
        created_at: { type: string, format: date-time, example: '2026-11-04T09:15:00+07:00' }

    CreateUserRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name: { type: string, maxLength: 150 }
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 8, maxLength: 72 }
        role: { type: string, description: Kode peran aktif di organisasi }
        division: { type: string, nullable: true, description: Kode divisi aktif di organisasi }
        unit_usaha_id: { type: integer, format: int64, nullable: true }

    UpdateUserRequest:
      type: object
      properties:
        name: { type: string, maxLength: 150 }
        role: { type: string }
        division: { type: string, nullable: true }
        unit_usaha_id: { type: integer, format: int64, nullable: true }

    Role:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: kasir-toko }
        name: { type: string, example: Kasir Toko }
        description: { type: string, nullable: true }
        is_system: { type: boolean, description: Peran administrator bawaan (semua izin, terkunci) }
        is_active: { type: boolean }
        permissions: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }

    CreateRoleRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, pattern: '^[a-z0-9]+([_-][a-z0-9]+)*$', maxLength: 50 }
        name: { type: string, maxLength: 100 }
        description: { type: string, nullable: true }
        permissions: { type: array, items: { type: string }, example: [m1.users.read] }

    UpdateRoleRequest:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, nullable: true }
        permissions: { type: array, items: { type: string } }

    Permission:
      type: object
      properties:
        code: { type: string, example: m1.users.manage }
        module: { type: string, example: m1 }
        description: { type: string }

    Division:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: penjualan }
        name: { type: string, example: Penjualan }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

    CreateDivisionRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, pattern: '^[a-z0-9]+([_-][a-z0-9]+)*$', maxLength: 50 }
        name: { type: string, maxLength: 100 }

    AuditLog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64, nullable: true, description: 'Null untuk aksi platform atau organisasi yang sudah dihapus' }
        organization_name: { type: string, nullable: true, description: Salinan nama organisasi saat kejadian }
        user_id: { type: integer, format: int64, nullable: true, description: 'Pelaku; null bila tidak dikenal atau akunnya sudah dihapus' }
        actor_name: { type: string, nullable: true, description: Salinan nama pelaku saat kejadian }
        actor_email: { type: string, nullable: true, description: Salinan email pelaku saat kejadian }
        action: { type: string, example: user.deactivated }
        resource: { type: string, example: users }
        resource_id: { type: integer, format: int64, nullable: true }
        old_value: { type: object, nullable: true }
        new_value: { type: object, nullable: true }
        ip_address: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

  responses:

    Deactivated:
      description: Data dinonaktifkan (tidak dihapus fisik)
      content:
        application/json:
          example: { success: true, data: { id: 42, is_active: false } }

    Deleted:
      description: Data dihapus permanen. Audit log tetap tersimpan.
      content:
        application/json:
          example: { success: true, data: { id: 42, deleted: true } }

    InvalidParameter:
      description: 'Parameter atau body tidak masuk akal (mis. JSON rusak, `to` < `from`)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { success: false, error: { code: INVALID_PARAMETER, message: Parameter tidak valid, fields: null } }

    ValidationError:
      description: Isian tidak lolos validasi
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { success: false, error: { code: VALIDATION_ERROR, message: Isian tidak valid, fields: { role: Peran tidak terdaftar } } }

    Unauthenticated:
      description: 'Token tidak sah (`UNAUTHENTICATED`), atau akun/organisasi nonaktif (`ACCOUNT_INACTIVE` / `ORGANIZATION_INACTIVE`)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { success: false, error: { code: UNAUTHENTICATED, message: Token tidak ada atau tidak sah, fields: null } }

    Forbidden:
      description: Tidak memiliki izin yang dibutuhkan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { success: false, error: { code: FORBIDDEN, message: Anda tidak berhak mengakses sumber daya ini, fields: null } }

    NotFound:
      description: 'Data tidak ditemukan di organisasi pemanggil (`USER_NOT_FOUND`, `ROLE_NOT_FOUND`, `DIVISION_NOT_FOUND`, `ORGANIZATION_NOT_FOUND`)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { success: false, error: { code: USER_NOT_FOUND, message: Pengguna tidak ditemukan, fields: null } }

    InternalError:
      description: Galat server (detail hanya di log server)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { success: false, error: { code: INTERNAL_ERROR, message: Terjadi kesalahan pada server, fields: null } }
